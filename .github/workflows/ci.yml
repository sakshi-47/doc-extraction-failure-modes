name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke test
        # The prior work shipped four experiment scripts that all raised
        # ImportError on a clean checkout, because a config constant was
        # deleted during cleanup and nothing ever re-imported them. This step
        # is nine seconds and makes that failure impossible.
        run: |
          python -c "import docfail, docfail.settings, docfail.types"
          python -c "import docfail.metrics as m; print(sorted(m.__all__))"
          python -c "import docfail.cli"
          python scripts/download_data.py --help > /dev/null

      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Types
        run: mypy || true   # advisory until the extractor layer lands

      - name: Tests
        run: pytest --cov=docfail --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --strict --desc || true   # advisory until deps are locked
